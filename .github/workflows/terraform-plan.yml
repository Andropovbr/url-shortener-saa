name: Terraform Plan

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-plan.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Plan (${{ matrix.environment }}/${{ matrix.layer }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            layer: core
            working_directory: infra/core
            backend_key: dev/core/terraform.tfstate
            tfvars_file: dev/terraform.tfvars

          - environment: dev
            layer: runtime
            working_directory: infra/runtime
            backend_key: dev/runtime/terraform.tfstate
            tfvars_file: dev/terraform.tfvars

          - environment: prod
            layer: core
            working_directory: infra/core
            backend_key: prod/core/terraform.tfstate
            tfvars_file: prod/terraform.tfvars

          - environment: prod
            layer: runtime
            working_directory: infra/runtime
            backend_key: prod/runtime/terraform.tfstate
            tfvars_file: prod/terraform.tfvars

    defaults:
      run:
        working-directory: ${{ matrix.working_directory }}

    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          role-session-name: github-actions-terraform-plan

      - name: Terraform version
        run: terraform version

      - name: Terraform init
        run: |
          terraform init \
            -input=false \
            -backend-config="key=${{ matrix.backend_key }}"

      - name: Terraform validate
        run: terraform validate

      - name: Show working directory
        run: |
          pwd
          ls -la
          echo "tfvars file: ${{ matrix.tfvars_file }}"

      - name: Check tfvars file
        run: |
          test -f "${{ matrix.tfvars_file }}" && echo "tfvars found" || (echo "tfvars NOT found" && exit 1)

      - name: Inspect tfvars directory
        run: |
            ls -la "${{ matrix.environment }}"
        
      - name: Terraform plan
        run: |
            terraform plan \
                -input=false \
                -no-color \
                -var-file="${{ matrix.tfvars_file }}"