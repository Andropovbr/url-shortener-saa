name: Application CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Install security tools
        run: |
          pip install pip-audit bandit

      - name: Run dependency vulnerability scan
        run: |
          pip-audit -r app/requirements.txt

      - name: Run static application security scan
        run: |
          bandit -r app

      - name: Run tests
        env:
          PYTHONPATH: .
          DDB_TABLE_NAME: test-table
          CACHE_ENABLED: "false"
        run: python -m pytest

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::792025037142:role/url-shortener-saa-github-ecr-push-role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_URI=792025037142.dkr.ecr.us-east-1.amazonaws.com/url-shortener-saa-repository:$IMAGE_TAG
          docker build -t $IMAGE_URI ./app
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Push Docker image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push $IMAGE_URI

      - name: Get current task definition
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws ecs describe-task-definition \
            --task-definition url-shortener-saa-task-dev \
            --query taskDefinition > task-def.json

      - name: Update image in task definition
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          jq --arg IMAGE "$IMAGE_URI" \
            '.containerDefinitions[0].image = $IMAGE' \
            task-def.json > new-task-def.json

      - name: Prepare task definition for registration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          jq '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
          ' new-task-def.json > deploy-task-def.json

      - name: Register new task definition
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://deploy-task-def.json > task-def-output.json

      - name: Extract new task definition ARN
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          TASK_DEF_ARN=$(jq -r '.taskDefinition.taskDefinitionArn' task-def-output.json)
          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV